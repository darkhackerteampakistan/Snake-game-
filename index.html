<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#9bbc0f">
  <title>Snake Classic - Nokia Style</title>

  <!-- ✅ RealFaviconGenerator এর Markup -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="stylesheet" href="style.css">
</head>
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <!-- PWA মেটা ট্যাগ -->
  <meta name="theme-color" content="#9bbc0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake">
  
  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- iOS এর জন্য আইকন -->
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <title>Snake Classic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- তোর আগের সব স্ক্রিন এখানে থাকবে (মেনু, গেম, কাস্টমাইজ) -->
  <!-- ...আগের কোড বসিয়ে দে... -->
</div>

<!-- ইনস্টল বাটন (নিজে থেকে দেখাবে) -->
<div id="installBanner" class="install-banner hidden">
  <span>📱 অ্যাপ হিসেবে ইনস্টল করো?</span>
  <button id="installBtn">ইনস্টল</button>
  <button id="closeInstall">✕</button>
</div>

<script src="script.js"></script>

<!-- Service Worker রেজিস্ট্রেশন -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('✅ Service Worker চালু:', reg.scope))
        .catch(err => console.log('❌ SW রেজিস্ট্রেশন ব্যর্থ:', err));
    });
  }

  // === ইনস্টল প্রম্পট ===
  let deferredPrompt = null;
  const banner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');
  const closeBtn = document.getElementById('closeInstall');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    banner.classList.remove('hidden');
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('ইনস্টল ফলাফল:', outcome);
    deferredPrompt = null;
    banner.classList.add('hidden');
  });

  closeBtn.addEventListener('click', () => {
    banner.classList.add('hidden');
  });

  // ইনস্টল হয়ে গেলে ব্যানার লুকাও
  window.addEventListener('appinstalled', () => {
    banner.classList.add('hidden');
    console.log('✅ অ্যাপ ইনস্টল হয়েছে!');
  });
</script>

</body>
</html>
